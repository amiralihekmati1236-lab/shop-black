<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | Shop.Black.gun</title><link rel="stylesheet" href="/style.css"></head><body><div class="floatLogo">Shop.Black.gun</div><main class="admin"><section id="login" class="box login"><small>ADMIN</small><h1>پنل مدیریت</h1><input id="pass" type="password" placeholder="رمز مدیریت"><button id="go" class="gold full">ورود</button><p id="err"></p></section><section id="panel" hidden><header><a class="brand" href="/">فروشگاه بلک گان <span>| 𝗕𝗹𝗮𝗰𝗸 𝗚𝘂𝗻</span></a><button id="out">خروج</button></header><div class="box"><h2>محصول</h2><input id="id" type="hidden"><input id="name" placeholder="نام محصول"><input id="price" type="number" step="0.01" placeholder="قیمت (میلیون تومان)"><input id="image" placeholder="لینک دائمی عکس"><textarea id="desc" placeholder="توضیحات"></textarea><button id="save" class="gold">ذخیره محصول</button><button id="cancel">لغو ویرایش</button></div><div class="box"><h2>محصولات</h2><div id="plist"></div></div><div class="box"><h2>ویدیو</h2><input id="title" placeholder="عنوان ویدیو"><input id="url" placeholder="لینک YouTube یا فایل ویدیو"><input id="vdesc" placeholder="توضیح"><button id="saveV" class="gold">افزودن ویدیو</button><div id="vlist"></div></div><div class="box"><h2>سفارش‌ها</h2><div id="olist"></div></div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0))+' میلیون تومان';async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}async function check(){let d=await api('/api/admin/check');if(d.admin){$('#login').hidden=true;$('#panel').hidden=false;load()}}async function load(){let[ps,vs,os]=await Promise.all([api('/api/admin/products'),api('/api/admin/videos'),api('/api/admin/orders')]);$('#plist').innerHTML=(ps||[]).map(p=>`<div class="adminItem"><img src="${esc(p.image)}"><div><b>${esc(p.name)}</b><small>${money(p.price)}</small><p>${esc(p.description)}</p></div><button onclick='edit(${JSON.stringify(p)})'>ویرایش</button><button onclick='delP(${p.id})'>حذف</button></div>`).join('')||'<p>محصولی نیست.</p>';$('#vlist').innerHTML=(vs||[]).map(v=>`<div class="adminItem"><div><b>${esc(v.title)}</b><small>${esc(v.url)}</small></div><button onclick='delV(${v.id})'>حذف</button></div>`).join('')||'<p>ویدیویی نیست.</p>';$('#olist').innerHTML=(os||[]).map(o=>`<div class="adminItem"><div><b>سفارش #${o.id}</b><small>${esc(o.customer_name)} | ${esc(o.phone)} | ${money(o.total)}</small><p>${esc(o.address||'')}</p></div><button onclick='status(${o.id},"${o.status==='done'?'new':'done'}")'>${o.status==='done'?'باز کردن':'انجام شد'}</button></div>`).join('')||'<p>سفارشی نیست.</p>'}window.edit=p=>{$('#id').value=p.id;$('#name').value=p.name;$('#price').value=p.price;$('#image').value=p.image;$('#desc').value=p.description||'';scrollTo(0,0)};window.delP=async id=>{if(confirm('حذف محصول؟')){await api('/api/admin/products/'+id,{method:'DELETE'});load()}};window.delV=async id=>{if(confirm('حذف ویدیو؟')){await api('/api/admin/videos/'+id,{method:'DELETE'});load()}};window.status=async(id,s)=>{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:s})});load()};$('#go').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#pass').value})});check()}catch(e){$('#err').textContent=e.message}};$('#out').onclick=()=>api('/api/admin/logout',{method:'POST'}).then(()=>location.reload());$('#save').onclick=async()=>{let id=$('#id').value,d={name:$('#name').value,price:Number($('#price').value),image:$('#image').value,description:$('#desc').value};await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(d)});$('#cancel').click();load()};$('#cancel').onclick=()=>{$('#id').value='';$('#name').value='';$('#price').value='';$('#image').value='';$('#desc').value=''};$('#saveV').onclick=async()=>{await api('/api/admin/videos',{method:'POST',body:JSON.stringify({title:$('#title').value,url:$('#url').value,description:$('#vdesc').value})});$('#title').value='';$('#url').value='';$('#vdesc').value='';load()};check();</script></body></html>
