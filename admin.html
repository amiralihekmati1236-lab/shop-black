<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | بلک گان</title><link rel="stylesheet" href="style.css"></head><body><main><section class="adminWrap"><h1>پنل مدیریت</h1><div id="login" class="card" style="padding:20px;max-width:450px;display:grid;gap:12px"><input id="password" type="password" placeholder="رمز مدیریت"><button id="loginBtn">ورود</button></div><div id="panel" hidden><div class="card" style="padding:20px;margin-bottom:20px;display:grid;gap:12px"><h2>افزودن محصول</h2><input id="pname" placeholder="نام محصول"><input id="pprice" type="number" placeholder="قیمت به میلیون تومان"><input id="pimage" placeholder="آدرس عکس دائمی"><input id="pfile" type="file" accept="image/*"><textarea id="pdesc" placeholder="توضیحات"></textarea><button id="addProduct">افزودن محصول</button></div><div class="card" style="padding:20px;margin-bottom:20px;display:grid;gap:12px"><h2>افزودن ویدیو</h2><input id="vtitle" placeholder="عنوان"><input id="vurl" placeholder="آدرس Embed ویدیو"><textarea id="vdesc" placeholder="توضیحات"></textarea><button id="addVideo">افزودن ویدیو</button></div><h2>محصولات</h2><div id="adminProducts" class="grid"></div><h2>ویدیوها</h2><div id="adminVideos" class="grid"></div><h2>سفارش‌ها</h2><div id="orders"></div></div></section></main><script src="admin.js"></script></body></html>
