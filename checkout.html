<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت سفارش | بلک گان</title><link rel="stylesheet" href="style.css"></head><body><main><section><h1>ثبت سفارش</h1><div id="summary" class="card" style="padding:20px"></div><form id="form" class="card" style="padding:20px;margin-top:20px;display:grid;gap:12px"><input name="customer_name" required placeholder="نام و نام خانوادگی"><input name="phone" required placeholder="شماره تماس"><textarea name="address" placeholder="آدرس"></textarea><div style="padding:18px;border:1px solid #4b3818;border-radius:12px;line-height:2">جهت ثبت سفارش خود مبلغ کالا را به شماره کارت واریز کنید و فیش واریزی رو در تلگرام به ایدی زیر ارسال کنید<br><b>6219861451025562</b><br><b>@BlackGun_support</b></div><button>ثبت سفارش</button></form></section></main><script>
const cart=JSON.parse(localStorage.getItem("blackgun_cart")||"[]");let total=0;document.querySelector("#summary").innerHTML=cart.map(x=>{total+=x.price*x.qty;return `<p>${x.name} × ${x.qty}</p>`}).join("")+`<hr><b>جمع: ${total.toLocaleString()} تومان</b>`;
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert("سبد خرید خالی است");const d=Object.fromEntries(new FormData(e.target));d.items=cart;d.total=total;d.status="new";const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)return alert("خطا در ثبت سفارش");localStorage.removeItem("blackgun_cart");alert("سفارش ثبت شد");location.href="/"};</script></body></html>
