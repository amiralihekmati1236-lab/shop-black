<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت سفارش | فروشگاه بلک گان</title><link rel="stylesheet" href="/style.css"></head><body><div class="floatLogo">Shop.Black.gun</div><header><a class="brand" href="/">فروشگاه بلک گان <span>| 𝗕𝗹𝗮𝗰𝗸 𝗚𝘂𝗻</span></a></header><main class="checkout"><section class="box"><small>CHECKOUT</small><h1>ثبت سفارش</h1><div id="summary"></div><form id="form"><input id="name" required placeholder="نام و نام خانوادگی"><input id="phone" required placeholder="شماره تماس"><textarea id="address" placeholder="آدرس / توضیحات"></textarea><div class="pay"><h3>پرداخت</h3><p>مبلغ سفارش را به شماره کارت زیر واریز کنید:</p><b>6219861451025562</b><p>فیش واریزی را در تلگرام ارسال کنید:</p><b>@BlackGun_support</b></div><button class="gold full">ثبت نهایی سفارش</button></form><div id="result"></div></section></main><script>const cart=JSON.parse(localStorage.getItem('shop_black_cart')||'[]'),m=n=>new Intl.NumberFormat('fa-IR').format(n)+' میلیون تومان',e=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),t=cart.reduce((a,x)=>a+Number(x.price)*x.qty,0);document.querySelector('#summary').innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${e(x.name)} × ${x.qty}</span><b>${m(x.price*x.qty)}</b></div>`).join('')+`<hr><div class="row"><b>مجموع</b><b>${m(t)}</b></div>`:'<p>سبد خرید خالی است.</p>';document.querySelector('#form').onsubmit=async ev=>{ev.preventDefault();if(!cart.length)return;let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:document.querySelector('#name').value,phone:document.querySelector('#phone').value,address:document.querySelector('#address').value,items:cart,total:t})}),d=await r.json();document.querySelector('#result').textContent=r.ok?'سفارش با موفقیت ثبت شد. فیش واریزی را در تلگرام ارسال کنید.':(d.error||'خطا');if(r.ok)localStorage.removeItem('shop_black_cart')}</script></body></html>
